services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: lumina-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - lumina-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: lumina-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-lumina}
    # Deliberately NOT published. api and ui reach it as postgres:5432 on the
    # compose network; publishing it put a database whose password defaults to
    # "changeme" on the LAN, holding the login hashes and the effects table that
    # the UI renders. Uncomment only to run psql from the host, and put it back.
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lumina-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumina}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: lumina-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumina}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-lumina}
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      FIRMWARE_DIR: /firmware
      # The address a STRIP should fetch firmware from. Cannot be worked out
      # here: this container is on a bridged network and only knows its own
      # 172.x address, which no ESP32 on the LAN can reach.
      FIRMWARE_BASE_URL: ${FIRMWARE_BASE_URL:-}
    ports:
      - "8001:8001"
    volumes:
      # Firmware images for OTA, served at /fw. A bind mount rather than a named
      # volume so a new build can be dropped in with scp and picked up without
      # rebuilding the image.
      - ./firmware/images:/firmware
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - lumina-net
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: lumina-ui
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumina}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-lumina}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env - see ui/src/auth.py}
      API_URL: http://api:8001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - lumina-net
    restart: unless-stopped

networks:
  lumina-net:
    driver: bridge

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
