[project]
name = "lumina-api"
version = "0.1.0"
description = "API service for Lumina IoT LED controller"
requires-python = ">=3.11"
# Version policy: FastAPI and Starlette carry upper bounds deliberately.
# Every dependency here was an unbounded ">=", so rebuilding an image - something
# done for reasons that have nothing to do with dependencies - silently pulled
# Starlette 1.x, whose TemplateResponse takes the request first. Every page in
# the UI broke at once, and the error surfaced inside Jinja's template cache as
# "unhashable type: dict", naming neither the argument nor the file.
dependencies = [
    "fastapi>=0.115.0,<0.200.0",
    "starlette<1.0",
    "uvicorn>=0.30.0",
    "paho-mqtt>=2.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-multipart>=0.0.9",
]
